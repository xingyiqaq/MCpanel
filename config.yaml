# ============================================================================
# MCpanel 配置文件
# ============================================================================

# server: 面板服务器设置
server:
  host: "0.0.0.0"       # 监听地址（0.0.0.0 = 所有网卡）
  port: 19888            # 面板端口
  name: "我的世界服务器"   # 面板标题

# server_dir: 服务器根目录（start.sh 会自动写入）
# server_dir: "."

# rcon: RCON 设置（留空会自动从 server.properties 检测/生成）
rcon:
  host: "127.0.0.1"     # RCON 地址
  port: 25575           # RCON 端口
  # password: "留空则自动检测"  # 不填则自动从 server.properties 读取

# mode: 通信模式（auto=优先RCON失败回退管道，rcon=仅RCON，pipe=仅管道）
mode: "auto"

# log_path: 日志文件路径（相对于 server_dir）
log_path: "logs/latest.log"

# java_process_keyword: Java 进程识别关键词
java_process_keyword: "unix_args.txt"

# wallpaper_dir: 壁纸目录（留空禁用）
wallpaper_dir: "wallpapers"

# lang_zh_file: 中文翻译缓存
lang_zh_file: "cache/lang_zh_all.json"